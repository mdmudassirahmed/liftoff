[project]
name = "liftoff-backend"
version = "1.2.0"
description = "Liftoff backend: diagram-to-IaC generation, security guardrails and Azure deployment API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
# Runtime dependencies are pinned in requirements.txt (single source of truth).

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
